<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artum8 Labs Portfolio</title>
    <link rel="stylesheet" href="css/main.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .loader-container {
            text-align: center;
            color: white;
        }
        
        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
        }
        
        .tagline {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.5s forwards;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1s forwards, spin 1s linear 1s infinite;
        }
        
        .loading-text {
            margin-top: 20px;
            font-size: 1rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1.5s forwards;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }
        
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="loader-container" id="loaderContainer">
        <div class="logo">Artum8 Labs</div>
        <div class="tagline">Innovating Tomorrow's Solutions</div>
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Portfolio...</div>
    </div>

    <script>
        // Redirect to homepage after loading animation
        setTimeout(function() {
            document.getElementById('loaderContainer').classList.add('fade-out');
            setTimeout(function() {
                window.location.href = 'pages/homepage.html';
            }, 500);
        }, 3000);
        
        // Preload the homepage for faster transition
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'pages/homepage.html';
        document.head.appendChild(link);
    </script>
</body>
</html>
